<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Mpho — let's talk</title>
  <meta name="description" content="Send Mpho Makwela a message, email her or connect on LinkedIn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <canvas id="fireflies" aria-hidden="true"></canvas>
  <header class="site-header">
    <a href="index.html" class="logo">Mpho M</a>
    <nav>
      <a href="about.html" data-nav="about">About</a>
      <a href="portfolio.html" data-nav="portfolio">Portfolio</a>
      <a href="contact.html" data-nav="contact">Contact</a>
    </nav>
    <button id="sound-toggle" class="pill-toggle" aria-pressed="true">🔊 sound on</button>
  </header>

  <main>
    <section class="contact">
      <form id="contact-form" class="fade-up">
        <h1>let's talk</h1>
        <p style="opacity:.8">Got a project, a role, or a South African jazz recommendation? Send it my way.</p>
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <label for="name">name</label>
        <input id="name" name="name" required maxlength="100" placeholder="Your name" class="field">
        <label for="email">email</label>
        <input id="email" name="email" type="email" required maxlength="255" placeholder="you@example.com" class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required maxlength="5000" rows="5" placeholder="Tell me what's on your mind..." class="field"></textarea>
        <div class="send-row">
          <button type="submit" class="btn-game">send</button>
          <p id="status" aria-live="polite"></p>
        </div>
        <div class="socials">
          <a href="https://www.linkedin.com/in/mpho-m-makes/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" data-sound="pop">
            <svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 11-.01 5 2.5 2.5 0 01.01-5zM3 9.75h4V21H3zM9.75 9.75h3.8v1.6h.05c.55-1 1.9-2 3.9-2 4.1 0 4.5 2.7 4.5 6.2V21h-4v-4.9c0-1.2 0-2.7-1.7-2.7s-1.9 1.3-1.9 2.6V21h-4z"/></svg>
          </a>
          <a id="gmail" href="#" target="_blank" rel="noopener noreferrer" aria-label="Email Mpho" data-sound="pop">
            <svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V6a1 1 0 011-1zm9 7.2L4.5 7v.3L12 13l7.5-5.7V7z"/></svg>
          </a>
        </div>
      </form>
      <div class="poke-me">
        <div id="contact-char"></div>
        <p class="pixel" id="pokes">go on, poke me</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
