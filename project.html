<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — Mpho M</title>
  <meta name="description" content="A project by Mpho Makwela.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="project">
  <canvas id="fireflies" aria-hidden="true"></canvas>
  <header class="site-header">
    <a href="index.html" class="logo">Mpho M</a>
    <nav>
      <a href="about.html" data-nav="about">About</a>
      <a href="portfolio.html" data-nav="portfolio">Portfolio</a>
      <a href="contact.html" data-nav="contact">Contact</a>
    </nav>
    <button id="sound-toggle" class="pill-toggle" aria-pressed="true">🔊 sound on</button>
  </header>

  <main>
    <!-- One page for every project: project.html?p=pdby, ?p=comic, ?p=sketches, ... -->
    <section class="wrap project fade-up" id="project"></section>
  </main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
    <button class="lb-btn" id="lb-close" style="right:1rem;top:1rem" aria-label="Close">✕</button>
    <button class="lb-btn" id="lb-prev" style="left:.75rem" aria-label="Previous">‹</button>
    <figure>
      <img id="lb-img" src="" alt="">
      <figcaption>
        <span class="display" id="lb-title" style="font-size:1.125rem"></span>
        <span class="pixel muted" id="lb-count" style="font-size:.6rem"></span>
        <a class="btn-game small" id="lb-link" href="#" target="_blank" rel="noopener noreferrer">read the article ↗</a>
      </figcaption>
    </figure>
    <button class="lb-btn" id="lb-next" style="right:.75rem" aria-label="Next">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
